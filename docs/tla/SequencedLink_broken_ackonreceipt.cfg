\* DELIBERATELY BROKEN configuration: ordering invariant 2 is violated --
\* the ACK watermark advances when the frame comes off the wire (Deliver)
\* instead of after it is committed to the drain queue (Commit).
\* TLC MUST find a violation here.  If it does not, the invariants are too weak.
SPECIFICATION Spec

CONSTANTS
    MaxMsg       = 3
    W            = 2
    Reserve      = 2
    MaxFreezes   = 1
    AckOnReceipt = TRUE
    DrainQueueVolatile = FALSE
    PruneOnTransmit    = FALSE

INVARIANTS
    TypeOK
    OrderingInv1
    OrderingInv2
    OrderingInv3
    RetentionSafety
    NoLossSafety
    NoDuplication
    FIFO
    NoUnboundedBacklog
    NoFatalGap
    DedupUnreachable
    CreditSound
    NoAbort

PROPERTIES
    DeliveryObligation
    RetentionDrains
