\* AUDIT-PASS CONFIG (added by the integration pass).
\* Membership.cfg EXACTLY -- every failure edge, spurious lease expiry and
\* discretionary abort_restore still enabled -- but checked against SpecSF,
\* which strengthens WF to SF on RestoreProcess and CommitRestore only.
\*
\* SF on those two steps is precisely the assumption "the lease outlives the
\* restore, so a restore that can proceed eventually does".  Contract 3 never
\* states it.  If liveness holds here and fails under Membership.cfg, the
\* missing liveness is EXACTLY that missing statement and nothing else.
SPECIFICATION SpecSF

CONSTANTS
    Ranks      = {"r0", "r1"}
    Agents     = {"a1", "a2"}
    Migratable = {"r1"}

    MaxMigrations      = 1
    MaxSuspectedAborts = 1
    MaxIncarnation     = 3
    MaxCrashes         = 1

    AbortEdgesEnabled  = TRUE
    ClearPauseAtCommit = FALSE
    FencedSigCont      = TRUE
    KeepFrozenOriginal = TRUE
    UnboundedRestoreRetries = TRUE
    OrchestratorAbortPauseFromPausing = TRUE

INVARIANTS
    TypeOK
    AtMostOneRunning
    LeaseExclusion
    ActiveHasProcess
    PauseSetConsistent
    NoPoison
    NoDeadEnd

PROPERTIES
    MonotonicIncarnation
    EventuallyUnpaused
    EventuallyActive

CHECK_DEADLOCK TRUE
