\* AUDIT-PASS FAULT INJECTION 2 of 2 (added by the integration pass).
\* Breaks contract 2's ordering invariant 3 directly: "retention is reclaimed
\* only on a validated cumulative ACK".  Here retention is released the instant
\* the frame reaches the socket -- the "TCP is reliable, the kernel owns it now"
\* mistake.  Ordering invariants 1 and 2 are both intact.
\* TLC MUST report a violation.
SPECIFICATION Spec

CONSTANTS
    MaxMsg       = 3
    W            = 2
    Reserve      = 2
    MaxFreezes   = 1
    AckOnReceipt = FALSE
    DrainQueueVolatile = FALSE
    PruneOnTransmit    = TRUE

INVARIANTS
    TypeOK
    OrderingInv1
    RetentionSafety
    NoLossSafety
    NoDuplication
    FIFO
    NoUnboundedBacklog
    CreditSound
