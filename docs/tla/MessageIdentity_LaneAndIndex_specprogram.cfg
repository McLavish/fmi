\* LaneAndIndex restricted to the design spec's own counterexample:
\*     rank0: bcast(root=0); barrier()
\*     rank1: barrier();     bcast(root=0)
\* Forces the exact shape the spec argues about: "rank0's bcast and rank1's
\* barrier are each that rank's collective #0", so a bare per-communicator
\* collective counter agrees and detects nothing.
\* EXPECTED: VIOLATED, with got.ci = expected.ci = 0 and op_kind differing.
SPECIFICATION Spec

CONSTANTS
    EnvelopeMode = "LaneAndIndex"
    Alphabet     = {"bcast", "barrier"}
    MaxProgLen   = 2

CONSTRAINT SpecCounterexample

INVARIANTS
    TypeOK
    NoEqualIndexCollision

CHECK_DEADLOCK FALSE
