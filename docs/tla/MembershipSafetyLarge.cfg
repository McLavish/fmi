\* MembershipSafetyLarge.cfg -- SAFETY + DEADLOCK ONLY, larger bounds.
\* Same protocol variant as Membership.cfg (the spec as written), but with
\* BOTH ranks migratable and a budget of two request_pause events, so that a
\* rank can be migrated twice and two migrations can overlap. Liveness is not
\* checked here: the livelock Membership.cfg reports would simply reappear,
\* and the two-migration model additionally hits the "one restore slot per
\* agent" state-space device (see the module header), which is a modelling
\* artifact rather than a protocol fact and would confuse a liveness verdict.
\*
\* MaxIncarnation = 4 is a bound, not a guard: TypeOK asserts it. Commits are
\* bounded by the number of entries into CHECKPOINTED, i.e. 2 pauses + 1
\* crash-driven abort_activation + 1 suspected abort_activation = 4.

SPECIFICATION Spec

CONSTANTS
    Ranks      = {"r0", "r1"}
    Agents     = {"a1", "a2"}
    Migratable = {"r0", "r1"}

    MaxMigrations      = 2
    MaxSuspectedAborts = 1
    MaxIncarnation     = 4
    MaxCrashes         = 1

    AbortEdgesEnabled  = TRUE
    ClearPauseAtCommit = FALSE
    FencedSigCont      = TRUE
    KeepFrozenOriginal = TRUE
    UnboundedRestoreRetries = TRUE
    OrchestratorAbortPauseFromPausing = TRUE

INVARIANTS
    TypeOK
    AtMostOneRunning
    LeaseExclusion
    ActiveHasProcess
    PauseSetConsistent
    NoPoison
    NoDeadEnd

CHECK_DEADLOCK TRUE
