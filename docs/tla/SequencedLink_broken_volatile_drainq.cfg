\* AUDIT-PASS FAULT INJECTION 1 of 2 (added by the integration pass).
\* Breaks contract 2's justification for ack_safe = next_received in CRIU mode:
\* "drain buffers are inside the image".  Here the drain queue is
\* connection-local instead, so `criu dump --tcp-close` destroys committed-but-
\* undrained frames after the sender has already been told it may prune them.
\* This is a DIFFERENT defect from AckOnReceipt: ordering invariant 2 is
\* respected (the ACK really is issued only after commit), the lie is about
\* what "durably held" means.
\* TLC MUST report a violation.  If it does not, the invariants are too weak.
SPECIFICATION Spec

CONSTANTS
    MaxMsg       = 3
    W            = 2
    Reserve      = 2
    MaxFreezes   = 1
    AckOnReceipt = FALSE
    DrainQueueVolatile = TRUE
    PruneOnTransmit    = FALSE

INVARIANTS
    TypeOK
    OrderingInv1
    OrderingInv3
    RetentionSafety
    NoLossSafety
    NoDuplication
    FIFO
    NoUnboundedBacklog
    CreditSound
