\* CORRECT configuration at the largest bounds that still exhaust in seconds.
\* Reserve > W here (the spec requires drain_reserve_frames >= window_frames),
\* whereas SequencedLink_correct.cfg uses the boundary case Reserve = W.
SPECIFICATION Spec

CONSTANTS
    MaxMsg       = 4
    W            = 3
    Reserve      = 4
    MaxFreezes   = 2
    AckOnReceipt = FALSE
    DrainQueueVolatile = FALSE
    PruneOnTransmit    = FALSE

INVARIANTS
    TypeOK
    OrderingInv1
    OrderingInv2
    OrderingInv3
    RetentionSafety
    NoLossSafety
    NoDuplication
    FIFO
    NoUnboundedBacklog
    NoFatalGap
    DedupUnreachable
    CreditSound
    NoAbort

PROPERTIES
    DeliveryObligation
    RetentionDrains
