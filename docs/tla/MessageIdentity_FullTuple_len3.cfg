\* Same as MessageIdentity_FullTuple.cfg but with programs up to length 3 and a
\* reduced alphabet, to widen coverage without blowing up the state space.
\* EXPECTED: HOLDS.
SPECIFICATION Spec

CONSTANTS
    EnvelopeMode = "FullTuple"
    Alphabet     = {"send", "recv", "bcast", "barrier"}
    MaxProgLen   = 3

INVARIANTS
    TypeOK
    NoSilentSubstitution
    NoFalseAbort

PROPERTIES
    Terminates

CHECK_DEADLOCK FALSE
