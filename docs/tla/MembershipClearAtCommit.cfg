\* MembershipClearAtCommit.cfg -- pause entry cleared at commit_restore
\* instead of at ACTIVATING -> ACTIVE. Everything else as the spec.
\* Expected: NoPoison violated -- deadline suspension is released while the
\* restored rank is still ACTIVATING (not yet re-paired), so a survivor
\* mid-operation throws Utils::Timeout and poisons its communicator.
SPECIFICATION Spec

CONSTANTS
    Ranks      = {"r0", "r1"}
    Agents     = {"a1", "a2"}
    Migratable = {"r1"}

    MaxMigrations      = 1
    MaxSuspectedAborts = 1
    MaxIncarnation     = 3
    MaxCrashes         = 1

    AbortEdgesEnabled  = TRUE
    ClearPauseAtCommit = TRUE
    FencedSigCont      = TRUE
    KeepFrozenOriginal = TRUE
    UnboundedRestoreRetries = TRUE
    OrchestratorAbortPauseFromPausing = TRUE

INVARIANTS
    TypeOK
    AtMostOneRunning
    LeaseExclusion
    ActiveHasProcess
    PauseSetConsistent
    NoPoison
    NoDeadEnd

PROPERTIES
    MonotonicIncarnation
    EventuallyUnpaused
    EventuallyActive

CHECK_DEADLOCK TRUE
