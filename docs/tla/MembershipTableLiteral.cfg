\* AUDIT-PASS CONFIG (added by the integration pass).
\* Contract 3's transition table taken LITERALLY, with a single per-node agent.
\*
\* The table gives PAUSING exactly one non-progress outbound edge --
\* `abort_pause`, "Driven by: agent, on dump failure" -- and gives the
\* orchestrator's `abort_pause` only on the CHECKPOINTED row.  With one sidecar
\* per node (contract 4: "a per-pod sidecar"), the question is whether the table
\* satisfies its OWN normative rule -- "every state must have at least one
\* outbound edge that an external actor can drive" -- when the agent is the
\* thing that failed.
\*
\* All three abort edges are ENABLED here.  The only change from Membership.cfg
\* is OrchestratorAbortPauseFromPausing = FALSE and a single agent.
SPECIFICATION Spec

CONSTANTS
    Ranks      = {"r0", "r1"}
    Agents     = {"a1"}
    Migratable = {"r1"}
    RestoreBudgetEnabled = FALSE
    MaxRestoreAttempts = 2

    MaxMigrations      = 1
    MaxSuspectedAborts = 1
    MaxIncarnation     = 3
    MaxCrashes         = 1

    AbortEdgesEnabled  = TRUE
    ClearPauseAtCommit = FALSE
    FencedSigCont      = TRUE
    KeepFrozenOriginal = TRUE
    UnboundedRestoreRetries = TRUE
    OrchestratorAbortPauseFromPausing = FALSE

INVARIANTS
    TypeOK
    AtMostOneRunning
    LeaseExclusion
    ActiveHasProcess
    PauseSetConsistent
    NoPoison
    NoDeadEnd

CHECK_DEADLOCK TRUE
