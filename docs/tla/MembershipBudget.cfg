\* Membership.cfg -- THE SPEC AS WRITTEN.
\* Cross-host shape (--leave-stopped), all three abort edges present, pause
\* entry cleared at ACTIVATING -> ACTIVE, SIGCONT fenced.
\*
\* RESULT (observed, not predicted): every INVARIANT holds and there is no
\* deadlock, but the LIVENESS properties are VIOLATED. Contract 3 places no
\* bound on how often the restore phase may be retried, so the rank can cycle
\* CHECKPOINTED/RESTORE_RESERVED for ever with paused[r] set -- which keeps
\* the job-wide `migrations_in_flight` deadline suspension on for ever.
\* Two distinct lassos were produced: lease-TTL-expiry <-> acquire_restore_lease,
\* and acquire_restore_lease <-> abort_restore.
\* See MembershipLiveness.cfg for the cooperative-progress counterpart.
SPECIFICATION Spec

CONSTANTS
    Ranks      = {"r0", "r1"}
    Agents     = {"a1", "a2"}
    Migratable = {"r1"}
    RestoreBudgetEnabled = TRUE
    MaxRestoreAttempts = 2

    MaxMigrations      = 1
    MaxSuspectedAborts = 1
    MaxIncarnation     = 3
    MaxCrashes         = 1

    AbortEdgesEnabled  = TRUE
    ClearPauseAtCommit = FALSE
    FencedSigCont      = TRUE
    KeepFrozenOriginal = TRUE
    UnboundedRestoreRetries = TRUE
    OrchestratorAbortPauseFromPausing = TRUE

INVARIANTS
    TypeOK
    AtMostOneRunning
    LeaseExclusion
    ActiveHasProcess
    PauseSetConsistent
    NoPoison
    NoDeadEnd

PROPERTIES
    MonotonicIncarnation
    EventuallyUnpaused
    EventuallyActive

CHECK_DEADLOCK TRUE
