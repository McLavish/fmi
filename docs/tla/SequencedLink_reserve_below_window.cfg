\* Reserve < W, which the spec's config validation REJECTS at parse time.
SPECIFICATION Spec
CONSTANTS
    MaxMsg       = 4
    W            = 3
    Reserve      = 1
    MaxFreezes   = 2
    AckOnReceipt = FALSE
    DrainQueueVolatile = FALSE
    PruneOnTransmit    = FALSE
INVARIANTS
    TypeOK
    RetentionSafety
    NoLossSafety
    NoDuplication
    FIFO
    NoUnboundedBacklog
    NoAbort
PROPERTIES
    DeliveryObligation
