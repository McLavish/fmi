\* MembershipSafety3Agents.cfg -- SAFETY + DEADLOCK ONLY, three agents.
\* Same protocol variant as Membership.cfg (the spec as written). Widens the
\* restore-arbitration dimension specifically: three agents may hold the lease
\* in turn and leave up to three restored-but-stopped processes competing for
\* one commit_restore, which is the scenario the discipline exists for.
\* One migration and one crash keep the model exhaustible.

SPECIFICATION Spec

CONSTANTS
    Ranks      = {"r0", "r1"}
    Agents     = {"a1", "a2", "a3"}
    Migratable = {"r1"}

    MaxMigrations      = 1
    MaxSuspectedAborts = 1
    MaxIncarnation     = 3
    MaxCrashes         = 1

    AbortEdgesEnabled  = TRUE
    ClearPauseAtCommit = FALSE
    FencedSigCont      = TRUE
    KeepFrozenOriginal = TRUE
    UnboundedRestoreRetries = TRUE
    OrchestratorAbortPauseFromPausing = TRUE

INVARIANTS
    TypeOK
    AtMostOneRunning
    LeaseExclusion
    ActiveHasProcess
    PauseSetConsistent
    NoPoison
    NoDeadEnd

CHECK_DEADLOCK TRUE
