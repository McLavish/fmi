\* CORRECT configuration: ACK becomes writable only after drain-commit.
\* This is the headline theorem: Freeze fireable at any instant, twice.
SPECIFICATION Spec

CONSTANTS
    MaxMsg       = 3
    W            = 2
    Reserve      = 2
    MaxFreezes   = 2
    AckOnReceipt = FALSE
    DrainQueueVolatile = FALSE
    PruneOnTransmit    = FALSE

INVARIANTS
    TypeOK
    OrderingInv1
    OrderingInv2
    OrderingInv3
    RetentionSafety
    NoLossSafety
    NoDuplication
    FIFO
    NoUnboundedBacklog
    NoFatalGap
    DedupUnreachable
    CreditSound
    NoAbort

PROPERTIES
    DeliveryObligation
    RetentionDrains
