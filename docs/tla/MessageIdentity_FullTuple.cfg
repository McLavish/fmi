\* FullTuple: ordinal + lane + (collective_index, op_kind, root) + total_length
\* + the reduction commutative/associative flags, all validated on receipt.
\* EXPECTED: NoSilentSubstitution HOLDS.
SPECIFICATION Spec

CONSTANTS
    EnvelopeMode = "FullTuple"
    Alphabet     = {"send", "recv", "bcast", "barrier", "reduce", "reduce_nc"}
    MaxProgLen   = 2

INVARIANTS
    TypeOK
    NoSilentSubstitution
    NoFalseAbort

PROPERTIES
    Terminates

\* Blocked receives and finished ranks are terminal by design.
CHECK_DEADLOCK FALSE
