\* LaneOnly restricted to the design spec's own motivating counterexample:
\*     rank0: bcast(root=0); barrier()
\*     rank1: barrier();     bcast(root=0)
\* EXPECTED: VIOLATED, reproducing the spec's trace verbatim.
SPECIFICATION Spec

CONSTANTS
    EnvelopeMode = "LaneOnly"
    Alphabet     = {"bcast", "barrier"}
    MaxProgLen   = 2

CONSTRAINT SpecCounterexample

INVARIANTS
    TypeOK
    NoSilentSubstitution

CHECK_DEADLOCK FALSE
