\* OrdinalOnly -- models TODAY'S Direct backend: no envelope at all, matching
\* is socket + arrival order (src/comm/Direct.cpp:28-72).  The per-directed-pair
\* FIFO ordinal is implicit in arrival position and therefore always agrees.
\* EXPECTED: NoSilentSubstitution is VIOLATED.
\* NoCrossLaneSubstitution is listed to force TLC to exhibit the p2p-vs-collective
\* collision specifically (a 1-byte app send consumed as a barrier/bcast fragment).
SPECIFICATION Spec

CONSTANTS
    EnvelopeMode = "OrdinalOnly"
    Alphabet     = {"send", "recv", "bcast", "barrier", "reduce", "reduce_nc"}
    MaxProgLen   = 2

INVARIANTS
    TypeOK
    NoCrossLaneSubstitution
    NoSilentSubstitution
    NoFalseAbort

CHECK_DEADLOCK FALSE
