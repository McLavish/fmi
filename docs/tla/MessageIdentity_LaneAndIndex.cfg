\* LaneAndIndex -- ordinal + lane + collective_index, but NOT op_kind/root/flags.
\* Checks the spec's claim: "A bare per-communicator collective counter is also
\* insufficient: rank0's bcast and rank1's barrier are each that rank's
\* collective #0."
\* EXPECTED: VIOLATED, with collective_index EQUAL on both sides.
SPECIFICATION Spec

CONSTANTS
    EnvelopeMode = "LaneAndIndex"
    Alphabet     = {"send", "recv", "bcast", "barrier", "reduce", "reduce_nc"}
    MaxProgLen   = 2

INVARIANTS
    TypeOK
    NoEqualIndexCollision
    NoSilentSubstitution
    NoFalseAbort

CHECK_DEADLOCK FALSE
