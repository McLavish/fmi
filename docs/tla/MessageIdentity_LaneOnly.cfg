\* LaneOnly -- ordinal + lane in {P2P, COLLECTIVE}, with per-lane FIFO drain
\* queues.  Cross-lane collisions are now impossible.
\* EXPECTED: NoSilentSubstitution is STILL VIOLATED, by collective-vs-collective:
\* both frames 1 byte, both lane = COLLECTIVE, both ordinals equal.
\* This is the envelope the design spec originally lacked.
SPECIFICATION Spec

CONSTANTS
    EnvelopeMode = "LaneOnly"
    Alphabet     = {"send", "recv", "bcast", "barrier", "reduce", "reduce_nc"}
    MaxProgLen   = 2

INVARIANTS
    TypeOK
    NoCollectiveCollision
    NoSilentSubstitution
    NoFalseAbort

CHECK_DEADLOCK FALSE
