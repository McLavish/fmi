\* DELIBERATELY FAILING CONFIG.  Same model as MessageIdentity_FullTuple.cfg,
\* but asserting NoLoudAbort so that TLC produces a WITNESS trace showing the
\* FullTuple validation actually firing (Utils::IdentityMismatch) on a
\* divergent schedule, rather than hanging or silently accepting.
\* EXPECTED: NoLoudAbort is VIOLATED.  That is the desired behaviour.
SPECIFICATION Spec

CONSTANTS
    EnvelopeMode = "FullTuple"
    Alphabet     = {"send", "recv", "bcast", "barrier", "reduce", "reduce_nc"}
    MaxProgLen   = 2

INVARIANTS
    TypeOK
    NoLoudAbort

CHECK_DEADLOCK FALSE
