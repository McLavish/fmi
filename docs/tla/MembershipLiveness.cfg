\* MembershipLiveness.cfg -- the spec, with the restore phase assumed to make
\* progress (UnboundedRestoreRetries = FALSE: no spurious lease expiry, no
\* discretionary abort_restore). Real failures -- agent crash, crash-driven
\* lease expiry, dump failure, abort_activation-on-a-dead-agent -- are all
\* still enabled. This isolates whether the COOPERATIVE protocol is live,
\* after Membership.cfg showed that the spec as written is not.
SPECIFICATION Spec

CONSTANTS
    Ranks      = {"r0", "r1"}
    Agents     = {"a1", "a2"}
    Migratable = {"r1"}
    RestoreBudgetEnabled = FALSE
    MaxRestoreAttempts = 2

    MaxMigrations      = 1
    MaxSuspectedAborts = 1
    MaxIncarnation     = 3
    MaxCrashes         = 1

    AbortEdgesEnabled  = TRUE
    ClearPauseAtCommit = FALSE
    FencedSigCont      = TRUE
    KeepFrozenOriginal = TRUE
    UnboundedRestoreRetries = FALSE
    OrchestratorAbortPauseFromPausing = TRUE

INVARIANTS
    TypeOK
    AtMostOneRunning
    LeaseExclusion
    ActiveHasProcess
    PauseSetConsistent
    NoPoison
    NoDeadEnd

PROPERTIES
    MonotonicIncarnation
    EventuallyUnpaused
    EventuallyActive

CHECK_DEADLOCK TRUE
