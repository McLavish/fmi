\* BROKEN variant, stage 2 of 3.
\* Same injected defect as SequencedLink_broken_ackonreceipt.cfg (ACK emitted on
\* receipt rather than after drain-commit).  OrderingInv2 is REMOVED from the
\* invariant list, because OrderingInv2 is a restatement of the very rule being
\* broken and trips at depth 4 before anything interesting happens.
\* What this configuration shows: the defect propagates past the receiver into
\* the SENDER, which prunes retention for a message the receiver does not
\* durably hold.  RetentionSafety must be violated.
SPECIFICATION Spec

CONSTANTS
    MaxMsg       = 3
    W            = 2
    Reserve      = 2
    MaxFreezes   = 1
    AckOnReceipt = TRUE
    DrainQueueVolatile = FALSE
    PruneOnTransmit    = FALSE

INVARIANTS
    TypeOK
    OrderingInv1
    RetentionSafety
    NoLossSafety
    NoDuplication
    FIFO
    NoUnboundedBacklog
    CreditSound
