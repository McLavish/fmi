\* OrdinalOnly restricted to {send, barrier}: forces the literal
\* "1-byte application send consumed as a barrier fragment" collision on
\* today's unframed Direct transport.
\* EXPECTED: VIOLATED.
SPECIFICATION Spec

CONSTANTS
    EnvelopeMode = "OrdinalOnly"
    Alphabet     = {"send", "recv", "barrier"}
    MaxProgLen   = 2

INVARIANTS
    TypeOK
    NoCrossLaneSubstitution

CHECK_DEADLOCK FALSE
