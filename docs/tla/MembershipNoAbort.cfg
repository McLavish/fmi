\* MembershipNoAbort.cfg -- THE PRE-REVIEW DESIGN.
\* Identical to Membership.cfg except AbortEdgesEnabled = FALSE, i.e. the
\* membership table WITHOUT abort_pause / abort_restore / abort_activation.
\* Expected: DEADLOCK (equivalently, NoDeadEnd violated). The trace is the
\* machine-checked proof that a failed `criu dump` wedges the job.
SPECIFICATION Spec

CONSTANTS
    Ranks      = {"r0", "r1"}
    Agents     = {"a1", "a2"}
    Migratable = {"r1"}
    RestoreBudgetEnabled = FALSE
    MaxRestoreAttempts = 2

    MaxMigrations      = 1
    MaxSuspectedAborts = 1
    MaxIncarnation     = 3
    MaxCrashes         = 1

    AbortEdgesEnabled  = FALSE
    ClearPauseAtCommit = FALSE
    FencedSigCont      = TRUE
    KeepFrozenOriginal = TRUE
    UnboundedRestoreRetries = TRUE
    OrchestratorAbortPauseFromPausing = TRUE

INVARIANTS
    TypeOK
    AtMostOneRunning
    LeaseExclusion
    ActiveHasProcess
    PauseSetConsistent
    NoPoison
    NoDeadEnd

PROPERTIES
    MonotonicIncarnation
    EventuallyUnpaused
    EventuallyActive

CHECK_DEADLOCK TRUE
