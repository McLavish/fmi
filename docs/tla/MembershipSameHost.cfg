\* MembershipSameHost.cfg -- same-host restore shape: criu dumps, then kills
\* and reaps the task so the immediate restore can reclaim the pid
\* (src/ft/experimental/LocalRankAgent.cpp:417). Everything else as the spec.
\* Expected: ActiveHasProcess violated -- machine-checked confirmation of the
\* spec's own "Frozen-original abort recovery is cross-host only".
SPECIFICATION Spec

CONSTANTS
    Ranks      = {"r0", "r1"}
    Agents     = {"a1", "a2"}
    Migratable = {"r1"}
    RestoreBudgetEnabled = FALSE
    MaxRestoreAttempts = 2

    MaxMigrations      = 1
    MaxSuspectedAborts = 1
    MaxIncarnation     = 3
    MaxCrashes         = 1

    AbortEdgesEnabled  = TRUE
    ClearPauseAtCommit = FALSE
    FencedSigCont      = TRUE
    KeepFrozenOriginal = FALSE
    UnboundedRestoreRetries = TRUE
    OrchestratorAbortPauseFromPausing = TRUE

INVARIANTS
    TypeOK
    AtMostOneRunning
    LeaseExclusion
    ActiveHasProcess
    PauseSetConsistent
    NoPoison
    NoDeadEnd

PROPERTIES
    MonotonicIncarnation
    EventuallyUnpaused
    EventuallyActive

CHECK_DEADLOCK TRUE
