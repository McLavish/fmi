\* FullTuple restricted to well-formed (Compatible) program pairs.
\* Checks the no-false-positive direction in isolation: identity validation
\* must never reject a legal program.
\* EXPECTED: HOLDS.
SPECIFICATION Spec

CONSTANTS
    EnvelopeMode = "FullTuple"
    Alphabet     = {"send", "recv", "bcast", "barrier", "reduce", "reduce_nc"}
    MaxProgLen   = 3

CONSTRAINT AlignedOnly

INVARIANTS
    TypeOK
    NoLoudAbort
    NoSilentSubstitution

\* No PROPERTIES here on purpose: TLC warns when a CONSTRAINT is combined with
\* liveness checking.  AlignedOnly only filters initial states (prog never
\* changes), but Terminates is checked unconstrained in MessageIdentity_FullTuple.cfg
\* rather than relying on that argument.

CHECK_DEADLOCK FALSE
