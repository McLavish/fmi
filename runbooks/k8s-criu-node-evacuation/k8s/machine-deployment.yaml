# One "machine": a single privileged pod, pinned to a node, running this machine's slice of ranks
# plus everything the rank agent needs to checkpoint them in place. The orchestrator `kubectl
# exec`s `fmi-rank-agent migrate-local` into this same container, so the agent shares the ranks'
# PID + mount namespace — the prerequisite for criu dump/restore.
#
# Templated; apply once per machine, e.g.:
#   MACHINE_ID=a BASE_PEER_ID=0 RANKS_HERE=4 NODE_VALUE=a \
#   FMI_IMAGE=... IMAGE_PULL_POLICY=... COMM_NAME=... NUM_PEERS=8 WINDOW_MS=20000 \
#   envsubst < k8s/machine-deployment.yaml | kubectl apply -f -
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fmi-machine-${MACHINE_ID}
  namespace: fmi-criu
  labels:
    app: fmi-machine
    fmi-machine: "${MACHINE_ID}"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fmi-machine
      fmi-machine: "${MACHINE_ID}"
  template:
    metadata:
      labels:
        app: fmi-machine
        fmi-machine: "${MACHINE_ID}"
    spec:
      # Pin this machine's ranks to a specific node so "evacuate a machine" means a real node.
      nodeSelector:
        fmi-machine: "${NODE_VALUE}"
      containers:
        - name: fmi-machine
          image: ${FMI_IMAGE}
          imagePullPolicy: ${IMAGE_PULL_POLICY}
          command: ["python3", "-u", "/opt/fmi/app/supervisor.py"]
          env:
            - name: HOST_ID
              value: "machine-${MACHINE_ID}"
            - name: NUM_PEERS
              value: "${NUM_PEERS}"
            - name: BASE_PEER_ID
              value: "${BASE_PEER_ID}"
            - name: RANKS_HERE
              value: "${RANKS_HERE}"
            - name: COMM_NAME
              value: "${COMM_NAME}"
            - name: REDIS_HOST
              value: "fmi-redis"
            - name: TCPUNCH_HOST
              value: "fmi-tcpunch"
            - name: WINDOW_MS
              value: "${WINDOW_MS}"
            - name: CONFIG_PATH
              value: "/tmp/fmi.json"
          securityContext:
            # criu needs to ptrace-seize, freeze, and recreate process trees.
            privileged: true
            seccompProfile:
              type: Unconfined
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: criu-tmp
              mountPath: /tmp
      volumes:
        # criu writes image trees and the ranks write their logs here; an emptyDir keeps that off
        # the (overlay) container root for cleaner checkpoint/restore IO.
        - name: criu-tmp
          emptyDir: {}
