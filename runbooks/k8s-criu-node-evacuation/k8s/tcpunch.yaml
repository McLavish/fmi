# Direct data-plane rendezvous. CRIU forces the Direct backend, which NAT-hole-punches peers via
# this tcpunchd. Every rank's config points Direct.host at the fmi-tcpunch Service.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fmi-tcpunch
  namespace: fmi-criu
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fmi-tcpunch
  template:
    metadata:
      labels:
        app: fmi-tcpunch
    spec:
      containers:
        - name: tcpunch
          image: ${FMI_IMAGE}
          imagePullPolicy: ${IMAGE_PULL_POLICY}
          command: ["/opt/fmi/bin/tcpunchd", "10000"]
          ports:
            - containerPort: 10000
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: fmi-tcpunch
  namespace: fmi-criu
spec:
  selector:
    app: fmi-tcpunch
  ports:
    - port: 10000
      targetPort: 10000
