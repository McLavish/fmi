# Drives and verifies one evacuation-to-serverless. Apply after the machine pods are Running
# and the fmi-restore Knative Service is Ready, e.g.:
#   FMI_IMAGE=... IMAGE_PULL_POLICY=... COMM_NAME=... NUM_PEERS=8 \
#   envsubst < k8s/orchestrator-job.yaml | kubectl apply -f -
apiVersion: batch/v1
kind: Job
metadata:
  name: fmi-orchestrator
  namespace: fmi-criu
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: fmi-orchestrator
    spec:
      serviceAccountName: fmi-orchestrator
      restartPolicy: Never
      containers:
        - name: orchestrator
          image: ${FMI_IMAGE}
          imagePullPolicy: ${IMAGE_PULL_POLICY}
          command: ["python3", "-u", "/opt/fmi/app/orchestrator.py"]
          env:
            - name: NAMESPACE
              value: "fmi-criu"
            - name: COMM_NAME
              value: "${COMM_NAME}"
            - name: NUM_PEERS
              value: "${NUM_PEERS}"
            - name: REDIS_HOST
              value: "fmi-redis"
            - name: EVACUATE_SELECTOR
              value: "app=fmi-machine,fmi-machine=a"
            - name: EVACUATE_DEPLOYMENT
              value: "fmi-machine-a"
            - name: ALL_MACHINES_SELECTOR
              value: "app=fmi-machine"
            - name: WORKER_CONTAINER
              value: "fmi-machine"
            - name: AGENT_CONFIG
              value: "/tmp/fmi.json"
            - name: RESTORE_URL
              value: "http://fmi-restore.fmi-criu.svc.cluster.local/restore"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
