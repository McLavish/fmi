# The orchestrator finds the machine pods, execs `fmi-rank-agent evacuate-local` into machine A,
# scales machine A's Deployment to zero once its ranks are staged, and reads pod logs to verify
# preserved state.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fmi-orchestrator
  namespace: fmi-criu
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: fmi-orchestrator
  namespace: fmi-criu
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fmi-orchestrator
  namespace: fmi-criu
subjects:
  - kind: ServiceAccount
    name: fmi-orchestrator
    namespace: fmi-criu
roleRef:
  kind: Role
  name: fmi-orchestrator
  apiGroup: rbac.authorization.k8s.io
