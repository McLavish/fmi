# The orchestrator finds the machine pods, execs `fmi-rank-agent migrate-local` into machine A,
# and reads pod logs to verify preserved state.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fmi-orchestrator
  namespace: fmi-criu
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: fmi-orchestrator
  namespace: fmi-criu
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fmi-orchestrator
  namespace: fmi-criu
subjects:
  - kind: ServiceAccount
    name: fmi-orchestrator
    namespace: fmi-criu
roleRef:
  kind: Role
  name: fmi-orchestrator
  apiGroup: rbac.authorization.k8s.io
