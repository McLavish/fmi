# Rendered through envsubst with:
#   FMI_IMAGE          full image ref; also stamped onto the VM-rank Jobs the
#                      orchestrator creates (via the FMI_IMAGE env)
#   IMAGE_PULL_POLICY  Always (registry) or IfNotPresent (in-cluster registry);
#                      inherited by the VM-rank Jobs via the IMAGE_PULL_POLICY env
apiVersion: batch/v1
kind: Job
metadata:
  name: fmi-orchestrator
  namespace: fmi
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: fmi-orchestrator
    spec:
      serviceAccountName: fmi-orchestrator
      restartPolicy: Never
      containers:
        - name: orchestrator
          image: ${FMI_IMAGE}
          imagePullPolicy: ${IMAGE_PULL_POLICY}
          command: ["python3.11", "-u", "/var/task/orchestrator.py", "run"]
          env:
            - name: FMI_IMAGE
              value: ${FMI_IMAGE}
            - name: IMAGE_PULL_POLICY
              value: ${IMAGE_PULL_POLICY}
            - name: FMI_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: SERVERLESS_URL
              value: http://fmi-serverless-rank.fmi.svc.cluster.local/invoke
            - name: GAP_S
              value: "5.0"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
