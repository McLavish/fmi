apiVersion: v1
kind: ServiceAccount
metadata:
  name: fmi-orchestrator
  namespace: fmi
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: fmi-orchestrator
  namespace: fmi
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "delete", "get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fmi-orchestrator
  namespace: fmi
subjects:
  - kind: ServiceAccount
    name: fmi-orchestrator
    namespace: fmi
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: fmi-orchestrator
