# Lightweight in-cluster Docker registry for the private-cluster runbook.
# Ephemeral (emptyDir) — images live only as long as the pod. That is fine for
# this demo and for CI: you build and push right before deploying. Exposed via a
# stable NodePort (30500) that every node and the control plane reach.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fmi-registry
  namespace: fmi
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fmi-registry
  template:
    metadata:
      labels:
        app: fmi-registry
    spec:
      containers:
        - name: registry
          image: registry:2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          volumeMounts:
            - name: data
              mountPath: /var/lib/registry
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: fmi-registry
  namespace: fmi
spec:
  type: NodePort
  selector:
    app: fmi-registry
  ports:
    - name: registry
      port: 5000
      targetPort: 5000
      nodePort: 30500
