apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: fmi-serverless-rank
  namespace: fmi
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/min-scale: "1"
        autoscaling.knative.dev/max-scale: "1"
    spec:
      containerConcurrency: 1
      timeoutSeconds: 300
      containers:
        - image: 323756936843.dkr.ecr.eu-central-1.amazonaws.com/fmi-knative-migration:v1
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
