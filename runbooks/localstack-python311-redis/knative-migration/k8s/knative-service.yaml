# Rendered through envsubst with:
#   FMI_IMAGE          full image ref (ECR tag on AWS, registry NodePort on a
#                      private cluster)
#   IMAGE_PULL_POLICY  Always (registry) or IfNotPresent (in-cluster registry)
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: fmi-serverless-rank
  namespace: fmi
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/min-scale: "1"
        autoscaling.knative.dev/max-scale: "1"
    spec:
      containerConcurrency: 1
      timeoutSeconds: 300
      containers:
        - image: ${FMI_IMAGE}
          imagePullPolicy: ${IMAGE_PULL_POLICY}
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
